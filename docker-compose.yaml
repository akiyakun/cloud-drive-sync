services:
  cloud-drive-sync:
    build: .
    image: cloud-drive-sync:0.3.1
    container_name: cloud-drive-sync
    # Admin UI (port 8000 inside) and the scheduler stay up; each sync runs as a child process
    restart: unless-stopped
    ports:
      - "${CDS_BIND_IP:-127.0.0.1}:${CDS_PORT:-8103}:8000"
    # Run as the app's own NAS user (registered in UGOS so the shared-folder ACLs apply; it also owns
    # the secrets dir). Files are created group-writable (CDS_UMASK) so members of CDS_GID can manage them.
    user: "${CDS_UID:?Set CDS_UID in .env}:${CDS_GID:?Set CDS_GID in .env}"
    environment:
      TZ: Asia/Tokyo
      # Host names the admin UI accepts (DNS rebinding protection). Never use *.
      CDS_ALLOWED_HOSTS: "${CDS_ALLOWED_HOSTS:-localhost,127.0.0.1}"
    volumes:
      # Secrets: SSH-only folder outside the SMB shares, read-only
      - type: bind
        source: "${CDS_SECRETS_DIR:?Set CDS_SECRETS_DIR in .env}"
        target: /secrets
        read_only: true
        bind:
          create_host_path: false
      # Config, sync state and archive
      - type: bind
        source: "${CDS_DATA_DIR:?Set CDS_DATA_DIR in .env}"
        target: /data
        bind:
          create_host_path: false
      # Output root that the AI reads (only this folder, not the whole share)
      - type: bind
        source: "${CDS_OUTPUT_DIR:?Set CDS_OUTPUT_DIR in .env}"
        target: /output
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1g
